name: Assemble CME index
on:
  workflow_dispatch:
  push:
    paths:
      - 'chunks/**'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Assemble index.html from base64 chunks
        run: |
          cat chunks/0*.b64 | base64 -d > index.html
          python3 - <<'PY'
          import hashlib
          data=open('index.html','rb').read()
          print('size', len(data))
          print('sha1', hashlib.sha1(data).hexdigest())
          assert hashlib.sha1(data).hexdigest() == 'a3a7a0155c99fee54d4110ffe61b98a91be3d80c'
          assert b'CME 295' in data
          PY
      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Assemble index.html from chunks"
          git push
