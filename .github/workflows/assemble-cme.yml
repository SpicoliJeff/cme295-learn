name: Assemble CME index
on:
  workflow_dispatch:
  push:
    paths:
      - 'chunks/**'
jobs:
  assemble:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Concatenate and decode chunks
        run: |
          set -euo pipefail
          cat chunks/[0-9][0-9].b64 | tr -d '\n\r ' > /tmp/all.b64
          base64 -d /tmp/all.b64 > index.html
          echo "Decoded size: $(wc -c < index.html)"
          sha1sum index.html
          grep -o '<title>[^<]*</title>' index.html || true
      - name: Commit index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Assemble CME index.html from chunks"
          git push
