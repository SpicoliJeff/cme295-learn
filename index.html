<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CME 295</title></head><body>
<p id="s">Loading CME 295…</p>
<script>
(async () => {
  const n = 10;
  const parts = [];
  for (let i = 0; i < n; i++) {
    const r = await fetch('part' + String(i).padStart(2,'0') + '.txt');
    if (!r.ok) throw new Error('part ' + i + ' ' + r.status);
    parts.push(await r.text());
  }
  document.open();
  document.write(parts.join(''));
  document.close();
})().catch(e => { document.getElementById('s').textContent = 'Load failed: ' + e; });
</script>
</body></html>
