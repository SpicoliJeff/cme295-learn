<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>CME 295</title></head><body>
<p id="s">Loading CME 295…</p>
<!-- CME 295 -->
<script type="module">
const n=5;
const parts=await Promise.all([...Array(n).keys()].map(i=>fetch("b"+i+".txt").then(r=>{if(!r.ok)throw new Error(r.status);return r.text();})));
const bin=Uint8Array.from(atob(parts.join("")),c=>c.charCodeAt(0));
const ds=new DecompressionStream("gzip");
const html=await new Response(new Blob([bin]).stream().pipeThrough(ds)).text();
document.open();document.write(html);document.close();
</script></body></html>
